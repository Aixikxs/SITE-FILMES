<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #141414; color: #fff; padding: 20px; }
        h1 { color: #e50914; margin-bottom: 20px; text-align: center; }
        .search-box { display: flex; max-width: 500px; margin: 0 auto 30px auto; gap: 10px; }
        input { flex: 1; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; outline: none; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; background: #e50914; color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #b81d24; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .card { background: #1f1f1f; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; text-align: center; padding-bottom: 8px; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 210px; object-fit: cover; }
        .card p { font-size: 13px; margin-top: 8px; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .player-container iframe { width: 90%; max-width: 900px; height: 70vh; border: none; border-radius: 8px; }
        .close-btn { margin-bottom: 12px; background: #fff; color: #000; padding: 8px 18px; font-weight: bold; border-radius: 20px; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <h1>CineFlix</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar filme...">
        <button onclick="buscarFilmes()">Buscar</button>
    </div>

    <div class="grid" id="moviesGrid">
        <p style="grid-column: 1/-1; text-align:center;">Carregando filmes...</p>
    </div>

    <div class="player-container" id="playerModal">
        <button class="close-btn" onclick="fecharPlayer()">✕ Fechar Player</button>
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
    </div>

    <script>
        const API_URL = "https://superflixapi.pro";

        async function carregarIniciais() {
            try {
                const res = await fetch(`${API_URL}/lista?category=filme&type=imdb&format=json`);
                const data = await res.json();
                renderizarFilmes(data);
            } catch (err) {
                document.getElementById('moviesGrid').innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Erro ao carregar catálogo.</p>';
            }
        }

        async function buscarFilmes() {
            const query = document.getElementById('searchInput').value;
            if (!query) return carregarIniciais();

            document.getElementById('moviesGrid').innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Buscando...</p>';
            try {
                const res = await fetch(`${API_URL}/lista?category=pesquisa&q=${encodeURIComponent(query)}&format=json`);
                const data = await res.json();
                renderizarFilmes(data);
            } catch (err) {
                document.getElementById('moviesGrid').innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Nenhum filme encontrado.</p>';
            }
        }

        function renderizarFilmes(lista) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            const itens = Array.isArray(lista) ? lista : (lista.data || []);

            if (itens.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Nenhum resultado encontrado.</p>';
                return;
            }

            itens.forEach(item => {
                const id = item.imdb || item.id || item.tmdb;
                const titulo = item.nome || item.title || "Filme sem título";
                const poster = item.poster || item.logo || item.image || "https://via.placeholder.com/150x225?text=Sem+Capa";

                if (id) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => abrirPlayer('filme', id);
                    card.innerHTML = `
                        <img src="${poster}" alt="${titulo}" onerror="this.src='https://via.placeholder.com/150x225?text=Sem+Capa'">
                        <p>${titulo}</p>
                    `;
                    grid.appendChild(card);
                }
            });
        }

        function abrirPlayer(tipo, id) {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoPlayer');
            iframe.src = `${API_URL}/${tipo}/${id}`;
            modal.style.display = 'flex';
        }

        function fecharPlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoPlayer');
            iframe.src = '';
            modal.style.display = 'none';
        }

        carregarIniciais();
    </script>
</body>
</html>
