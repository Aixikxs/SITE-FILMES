<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITEFLIX - Sua Plataforma de Streaming</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">SITEFLIX</div>
            <button class="close-sidebar" id="closeSidebar">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link active">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Início</span>
            </a>
            <a href="browse.html?type=movies" class="nav-link">
                <span class="nav-icon">🎬</span>
                <span class="nav-text">Filmes</span>
            </a>
            <a href="browse.html?type=series" class="nav-link">
                <span class="nav-icon">📺</span>
                <span class="nav-text">Séries</span>
            </a>
            <a href="#favorites" class="nav-link">
                <span class="nav-icon">❤️</span>
                <span class="nav-text">Favoritos</span>
            </a>
            <a href="#history" class="nav-link">
                <span class="nav-icon">🕐</span>
                <span class="nav-text">Histórico</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-favorites" id="favoritesBtn">
                <span class="nav-icon">❤️</span>
                <span>Favoritos</span>
            </button>
            <button class="btn-history" id="historyBtn">
                <span class="nav-icon">🕐</span>
                <span>Histórico</span>
            </button>
        </div>
    </aside>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header -->
        <header class="header">
            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar filmes, séries...">
                <button class="search-btn" id="searchBtn">🔍</button>
            </div>
            
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" title="Alternar tema">🌙</button>
            </div>
        </header>

        <!-- Content -->
        <main class="content">
            <!-- Hero Banner -->
            <section class="hero-banner">
                <div class="hero-content">
                    <div class="hero-text">
                        <h1 class="hero-title">Bem-vindo ao SITEFLIX</h1>
                        <p class="hero-subtitle">
                            Descubra milhares de filmes e séries de qualidade. 
                            Assista em qualquer dispositivo, a qualquer hora.
                        </p>
                        <div class="hero-buttons">
                            <button class="btn btn-primary">▶ Começar a Assistir</button>
                            <button class="btn btn-secondary">ℹ️ Saiba Mais</button>
                        </div>
                    </div>
                    <div class="hero-image">
                        <div class="neon-box"></div>
                    </div>
                </div>
            </section>

            <!-- Trending Section -->
            <section class="content-section trending-section">
                <div class="section-header">
                    <h2 class="section-title">Em Destaque</h2>
                    <a href="browse.html?type=all" class="view-all-link" data-type="all">
                        Ver Tudo →
                    </a>
                </div>
                <div class="carousel-container">
                    <div class="carousel content-grid" id="trendingContainer"></div>
                </div>
            </section>

            <!-- Movies Section -->
            <section class="content-section">
                <div class="section-header">
                    <h2 class="section-title">🎬 Filmes Populares</h2>
                    <a href="browse.html?type=movies" class="view-all-link" data-type="movies">
                        Ver Tudo →
                    </a>
                </div>
                <div class="carousel-container">
                    <div class="carousel content-grid" id="moviesContainer"></div>
                </div>
            </section>

            <!-- Series Section -->
            <section class="content-section">
                <div class="section-header">
                    <h2 class="section-title">📺 Séries Populares</h2>
                    <a href="browse.html?type=series" class="view-all-link" data-type="series">
                        Ver Tudo →
                    </a>
                </div>
                <div class="carousel-container">
                    <div class="carousel content-grid" id="seriesContainer"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal de Detalhes -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
