<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - Filmes, Séries, Animes e Canais</title>
    
    <!-- Open Graph / Redes Sociais -->
    <meta property="og:title" content="CineFlix - Filmes, Séries e Animes Online">
    <meta property="og:description" content="Assista aos últimos lançamentos de filmes, séries, animes e canais ao vivo de graça!">
    <meta property="og:type" content="website">

    <!-- Fontes e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #141418;
            --bg-card: #1c1c24;
            --accent-red: #e50914;
            --accent-red-hover: #ff1e27;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-glow: 0 8px 32px rgba(229, 9, 20, 0.25);
            --transition-fast: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.15) 0%, rgba(10, 10, 12, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 768px) {
            header {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 18px 48px;
            }
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-icon {
            background: var(--accent-red);
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 14px rgba(229, 9, 20, 0.4);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text span {
            color: var(--accent-red);
            -webkit-text-fill-color: var(--accent-red);
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 450px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px 12px 46px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: var(--transition-fast);
        }

        .search-box input:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 0 4px rgba(229, 9, 20, 0.15);
            background: var(--bg-secondary);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            transition: var(--transition-fast);
        }

        .search-box input:focus + i {
            color: var(--accent-red);
        }

        .nav-tabs-wrapper {
            position: relative;
            z-index: 10;
            padding: 20px 24px 0 24px;
        }

        @media (min-width: 768px) {
            .nav-tabs-wrapper {
                padding: 28px 48px 0 48px;
            }
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-fast);
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.2);
            background: var(--bg-card);
        }

        .tab-btn.active {
            background: var(--accent-red);
            color: #ffffff;
            border-color: var(--accent-red);
            box-shadow: 0 4px 16px rgba(229, 9, 20, 0.35);
        }

        main {
            flex: 1;
            position: relative;
            z-index: 1;
            padding: 24px;
        }

        @media (min-width: 768px) {
            main {
                padding: 32px 48px;
            }
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--accent-red);
            border-radius: 4px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        @media (min-width: 576px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 20px;
            }
        }

        @media (min-width: 992px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
                gap: 24px;
            }
        }

        .card {
            background: var(--bg-card);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: var(--transition-fast);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), 0 0 20px rgba(229, 9, 20, 0.15);
        }

        .card-poster {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: var(--bg-secondary);
        }

        .card-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover .card-poster img {
            transform: scale(1.08);
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition-fast);
        }

        .card:hover .play-overlay {
            opacity: 1;
        }

        .play-btn-icon {
            width: 50px;
            height: 50px;
            background: var(--accent-red);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transform: scale(0.8);
            transition: var(--transition-fast);
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.6);
        }

        .card:hover .play-btn-icon {
            transform: scale(1);
        }

        .card-info {
            padding: 12px 14px;
            background: var(--bg-card);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-type {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: capitalize;
        }

        .state-container {
            grid-column: 1 / -1;
            padding: 80px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-muted);
        }

        .state-icon {
            font-size: 40px;
            color: var(--accent-red);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(229, 9, 20, 0.2);
            border-top-color: var(--accent-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .player-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: modalFadeIn 0.3s ease forwards;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .player-wrapper {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-secondary);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.8), 0 0 40px rgba(229, 9, 20, 0.2);
            display: flex;
            flex-direction: column;
        }

        .player-header {
            padding: 14px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-player-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition-fast);
        }

        .close-player-btn:hover {
            background: var(--accent-red);
            transform: rotate(90deg);
        }

        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            background: var(--bg-primary);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" onclick="carregarCategoria('filmes')">
            <div class="logo-icon">
                <i class="fa-solid fa-play"></i>
            </div>
            <div class="logo-text">Cine<span>Flix</span></div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar por filmes, séries, animes..." onkeyup="handleSearchKey(event)">
            <i class="fa-solid fa-magnifying-glass" onclick="buscarItens()"></i>
        </div>
    </header>

    <div class="nav-tabs-wrapper">
        <div class="nav-tabs">
            <button class="tab-btn active" id="btn-filmes" onclick="carregarCategoria('filmes')">
                <i class="fa-solid fa-film"></i> Filmes
            </button>

            <button class="tab-btn" id="btn-series" onclick="carregarCategoria('series')">
                <i class="fa-solid fa-tv"></i> Séries
            </button>

            <button class="tab-btn" id="btn-animes" onclick="carregarCategoria('animes')">
                <i class="fa-solid fa-dragon"></i> Animes
            </button>

            <button class="tab-btn" id="btn-canais" onclick="carregarCategoria('canais')">
                <i class="fa-solid fa-tower-broadcast"></i> Canais ao Vivo
            </button>
        </div>
    </div>

    <main>
        <div class="section-header">
            <h2 class="section-title" id="sectionTitle">Catálogo de Filmes</h2>
        </div>

        <div class="movies-grid" id="moviesGrid">
        </div>
    </main>

    <div class="player-modal" id="playerModal">
        <div class="player-wrapper">
            <div class="player-header">
                <div class="player-title" id="playerModalTitle">
                    <i class="fa-solid fa-circle-play" style="color: var(--accent-red);"></i> Assistindo
                </div>
                <button class="close-player-btn" onclick="fecharPlayer()" title="Fechar Player">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="iframe-container">
                <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; CineFlix - Todos os direitos reservados. Interface otimizada para streaming.</p>
    </footer>

    <script>
        const API_URL = "https://superflixapi.pro";
        let categoriaAtual = "filmes";
        let debounceTimer;

        const categoryMap = {
            'filmes': { apiCategory: 'filme', label: 'Filmes' },
            'series': { apiCategory: 'serie', label: 'Séries' },
            'animes': { apiCategory: 'anime', label: 'Animes' },
            'canais': { apiCategory: 'canal', label: 'Canais ao Vivo' }
        };

        async function carregarCategoria(catKey) {
            categoriaAtual = catKey;

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${catKey}`);
            if (activeBtn) activeBtn.classList.add('active');

            const config = categoryMap[catKey] || { label: 'Catálogo', apiCategory: catKey };
            document.getElementById('sectionTitle').innerHTML = `Catálogo de ${config.label}`;

            document.getElementById('searchInput').value = '';
            mostrarCarregando();

            try {
                const targetCategory = config.apiCategory;
                const response = await fetch(`${API_URL}/lista?category=${targetCategory}&format=json`);
                
                if (!response.ok) throw new Error("Falha na resposta da API");

                const data = await response.json();
                renderizarItens(data);
            } catch (err) {
                console.error("Erro ao carregar categoria:", err);
                try {
                    const fallbackRes = await fetch(`${API_URL}/lista?category=${config.apiCategory}`);
                    const fallbackData = await fallbackRes.json();
                    renderizarItens(fallbackData);
                } catch (fallbackErr) {
                    mostrarErro("Não foi possível carregar este catálogo no momento. Tente novamente mais tarde.");
                }
            }
        }

        async function buscarItens() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return carregarCategoria(categoriaAtual);

            document.getElementById('sectionTitle').innerText = `Resultados para: "${query}"`;
            mostrarCarregando();

            try {
                const response = await fetch(`${API_URL}/lista?category=pesquisa&q=${encodeURIComponent(query)}&format=json`);
                if (!response.ok) throw new Error("Erro na busca");

                const data = await response.json();
                renderizarItens(data);
            } catch (err) {
                console.error("Erro na busca:", err);
                mostrarErro("Nenhum resultado encontrado para a sua pesquisa.");
            }
        }

        function handleSearchKey(event) {
            clearTimeout(debounceTimer);
            if (event.key === 'Enter') {
                buscarItens();
            } else {
                debounceTimer = setTimeout(() => {
                    if (document.getElementById('searchInput').value.trim().length >= 3) {
                        buscarItens();
                    } else if (document.getElementById('searchInput').value.trim().length === 0) {
                        carregarCategoria(categoriaAtual);
                    }
                }, 600);
            }
        }

        function renderizarItens(lista) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            const itens = Array.isArray(lista) ? lista : (lista.data || lista.results || []);

            if (!itens || itens.length === 0) {
                mostrarVazio("Nenhum item encontrado nesta categoria.");
                return;
            }

            itens.forEach(item => {
                const id = item.imdb || item.id || item.tmdb;
                const titulo = item.nome || item.title || item.name || "Sem Título";
                const poster = item.poster || item.logo || item.image || item.cover || "https://via.placeholder.com/300x450/1c1c24/a0a0b0?text=Sem+Capa";
                
                const config = categoryMap[categoriaAtual] || {};
                const playerTipo = config.apiCategory || 'filme';

                if (id) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => abrirPlayer(playerTipo, id, titulo);

                    card.innerHTML = `
                        <div class="card-poster">
                            <img src="${poster}" alt="${titulo}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450/1c1c24/a0a0b0?text=Sem+Capa'">
                            <div class="play-overlay">
                                <div class="play-btn-icon">
                                    <i class="fa-solid fa-play"></i>
                                </div>
                            </div>
                        </div>
                        <div class="card-info">
                            <div class="card-title" title="${titulo}">${titulo}</div>
                            <div class="card-type">${config.label || 'Mídia'}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });
        }

        function abrirPlayer(tipo, id, titulo = "Filme") {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoPlayer');
            const modalTitle = document.getElementById('playerModalTitle');

            modalTitle.innerHTML = `<i class="fa-solid fa-circle-play" style="color: var(--accent-red);"></i> Assistindo: ${titulo}`;
            
            iframe.src = `${API_URL}/${tipo}/${id}`;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function fecharPlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoPlayer');

            iframe.src = '';
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('playerModal').addEventListener('click', function(e) {
            if (e.target === this) {
                fecharPlayer();
            }
        });

        function mostrarCarregando() {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = `
                <div class="state-container">
                    <div class="spinner"></div>
                    <p>Carregando catálogo...</p>
                </div>
            `;
        }

        function mostrarErro(mensagem) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = `
                <div class="state-container">
                    <i class="fa-solid fa-triangle-exclamation state-icon"></i>
                    <p>${mensagem}</p>
                </div>
            `;
        }

        function mostrarVazio(mensagem) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = `
                <div class="state-container">
                    <i class="fa-solid fa-film state-icon"></i>
                    <p>${mensagem}</p>
                </div>
            `;
        }

        carregarCategoria('filmes');
    </script>
</body>
</html>
