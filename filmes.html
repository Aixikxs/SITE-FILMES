<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes - SiteFlix</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/content-page.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1 class="logo">SiteFlix</h1>
            <button class="close-sidebar" id="closeSidebar">
                <span></span>
                <span></span>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link" data-category="inicio">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Início</span>
            </a>
            <a href="filmes.html" class="nav-link active" data-category="filmes">
                <span class="nav-icon">🎬</span>
                <span class="nav-text">Filmes</span>
            </a>
            <a href="series.html" class="nav-link" data-category="series">
                <span class="nav-icon">📺</span>
                <span class="nav-text">Séries</span>
            </a>
            <a href="animes.html" class="nav-link" data-category="animes">
                <span class="nav-icon">✨</span>
                <span class="nav-text">Animes</span>
            </a>
            <a href="doramas.html" class="nav-link" data-category="doramas">
                <span class="nav-icon">💫</span>
                <span class="nav-text">Doramas</span>
            </a>
            <a href="canais.html" class="nav-link" data-category="canais">
                <span class="nav-icon">📡</span>
                <span class="nav-text">Canais</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-favorites" id="favoritesBtn">
                <span class="nav-icon">❤️</span>
                <span class="nav-text">Favoritos</span>
            </button>
            <button class="btn-history" id="historyBtn">
                <span class="nav-icon">⏱️</span>
                <span class="nav-text">Histórico</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Header -->
        <header class="header">
            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar filmes...">
                <button class="search-btn">🔍</button>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle">🌙</button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="content">
            <div class="page-header">
                <h1 class="page-title">🎬 Filmes</h1>
                <p class="page-subtitle">Explore a maior coleção de filmes</p>
            </div>

            <!-- Filters -->
            <div class="filters-section">
                <select class="filter-select" id="genreFilter">
                    <option value="">Todos os Gêneros</option>
                    <option value="action">Ação</option>
                    <option value="drama">Drama</option>
                    <option value="comedy">Comédia</option>
                    <option value="horror">Terror</option>
                    <option value="sci-fi">Ficção Científica</option>
                </select>
                <select class="filter-select" id="yearFilter">
                    <option value="">Todos os Anos</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                </select>
                <select class="filter-select" id="sortFilter">
                    <option value="trending">Mais Assistidos</option>
                    <option value="newest">Mais Recentes</option>
                    <option value="rating">Melhor Avaliação</option>
                </select>
            </div>

            <!-- Content Grid -->
            <div class="content-grid" id="moviesGrid">
                <!-- Items carregados via JavaScript -->
            </div>

            <!-- Load More -->
            <div class="load-more-container">
                <button class="btn btn-primary" id="loadMoreBtn">Carregar Mais</button>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-body" id="modalBody">
                <!-- Conteúdo carregado dinamicamente -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/content-page.js"></script>
</body>
</html>
