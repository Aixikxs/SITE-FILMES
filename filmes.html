<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Filmes - SiteFlix</title>

<link rel="stylesheet" href="css/global.css">

<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
}

.card {
    background: #222;
    padding: 15px;
    border-radius: 10px;
}

.card h3 {
    font-size: 16px;
}

button {
    background: red;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
}
</style>

</head>

<body>

<div class="container">

<h1>🎬 Filmes</h1>

<div class="grid" id="moviesGrid">
Carregando filmes...
</div>

</div>


<script>

const API = "https://superflixapi.pro";


async function carregarFilmes(){

const grid = document.getElementById("moviesGrid");


try {

const resposta = await fetch(
API + "/lista?category=filme&type=tmdb&format=json"
);


const ids = await resposta.json();


grid.innerHTML = "";


ids.slice(0,20).forEach(id=>{


let card = document.createElement("div");

card.className="card";


card.innerHTML = `

<h3>Filme ID: ${id}</h3>

<button onclick="assistir('${id}')">
Assistir
</button>

`;


grid.appendChild(card);


});


}catch(e){

grid.innerHTML="Erro ao carregar filmes";

console.log(e);

}


}



function assistir(id){

window.location.href =
"player.html?id="+id+"&type=filme";

}



carregarFilmes();


</script>


</body>
</html>
