<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SINAL+ Streaming</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#090c12;
--surface:#121826;
--surface2:#1a2233;
--text:#f3f5fb;
--muted:#a6adc2;
--violet:#7b61ff;
--cyan:#26e8c5;
--red:#ff4d5e;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:var(--bg);
color:var(--text);
font-family:Inter,sans-serif;
min-height:100vh;
overflow-x:hidden;
}

button{
cursor:pointer;
border:0;
font-family:inherit;
}

header{
height:70px;
display:flex;
align-items:center;
padding:0 28px;
gap:25px;
position:sticky;
top:0;
z-index:20;
background:rgba(9,12,18,.85);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
font-family:Space Grotesk;
font-size:22px;
font-weight:700;
}

.logo span{
color:var(--cyan);
}

nav{
display:flex;
gap:8px;
flex:1;
}

.tab{
background:none;
color:var(--muted);
padding:9px 15px;
border-radius:8px;
}

.tab.active,
.tab:hover{
background:var(--surface2);
color:white;
}

.search{
width:220px;
background:var(--surface);
border:1px solid rgba(255,255,255,.08);
padding:10px 14px;
border-radius:10px;
color:white;
outline:none;
}


.hero{
margin:25px 28px;
height:450px;
border-radius:20px;
overflow:hidden;
position:relative;
background-size:cover;
background-position:center;
display:flex;
align-items:end;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(0deg,var(--bg),transparent 70%),
linear-gradient(90deg,rgba(0,0,0,.8),transparent);
}

.hero-content{
position:relative;
z-index:2;
padding:40px;
max-width:650px;
}

.hero h1{
font-family:Space Grotesk;
font-size:50px;
margin-bottom:15px;
}

.meta{
color:var(--muted);
display:flex;
gap:12px;
margin-bottom:15px;
}

.description{
color:var(--muted);
line-height:1.6;
}

.btn{
margin-top:20px;
padding:12px 22px;
border-radius:10px;
font-weight:600;
}

.play{
background:white;
color:#111;
}

.info{
background:rgba(255,255,255,.1);
color:white;
margin-left:10px;
}


.section{
margin-top:35px;
}

.title{
font-size:20px;
font-weight:600;
padding:0 28px;
margin-bottom:15px;
}


.row{
display:flex;
gap:16px;
overflow-x:auto;
padding:0 28px;
}


.card{
min-width:150px;
height:225px;
border-radius:12px;
overflow:hidden;
background:var(--surface);
position:relative;
cursor:pointer;
transition:.25s;
background-size:cover;
background-position:center;
}

.card:hover{
transform:translateY(-7px);
}


.card-info{
position:absolute;
bottom:0;
width:100%;
padding:12px;
background:linear-gradient(transparent,rgba(0,0,0,.9));
}

.card h3{
font-size:14px;
}


.badge{
position:absolute;
top:10px;
left:10px;
background:rgba(0,0,0,.6);
padding:4px 8px;
border-radius:6px;
font-size:11px;
}


@media(max-width:700px){

header{
padding:0 15px;
}

.logo{
display:none;
}

.search{
width:130px;
}

.hero{
margin:15px;
height:360px;
}

.hero h1{
font-size:35px;
}

.hero-content{
padding:25px;
}

.card{
min-width:120px;
height:180px;
}

}
</style>

</head>

<body>

<header>

<div class="logo">
SINAL<span>+</span>
</div>

<nav>
<button class="tab active">Início</button>
<button class="tab">Filmes</button>
<button class="tab">Séries</button>
<button class="tab">Animes</button>
<button class="tab">TV</button>
</nav>

<input class="search" placeholder="Buscar...">

</header>


<section class="hero" id="hero">

<div class="hero-content">

<h1 id="heroTitle">
Carregando...
</h1>

<div class="meta" id="heroMeta"></div>

<p class="description" id="heroDesc">
Aguarde carregando catálogo...
</p>

<button class="btn play">
▶ Assistir
</button>

<button class="btn info">
+ Minha Lista
</button>

</div>

</section>


<main id="content"></main>
