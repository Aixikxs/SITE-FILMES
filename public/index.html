<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080911">
  <meta name="description" content="SiteFlix: seu catálogo de filmes, séries, animes, doramas e canais.">
  <title>SiteFlix — streaming</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="SiteFlix início"><span>Site</span>Flix</a>
    <nav class="main-nav" aria-label="Navegação principal">
      <button data-category="home">Início</button><button data-category="filme">Filmes</button><button data-category="serie">Séries</button><button data-category="anime">Animes</button><button data-category="dorama">Doramas</button><button data-category="canais">Canais</button>
    </nav>
    <form class="search-form" id="searchForm"><label class="sr-only" for="search">Buscar no catálogo</label><input id="search" autocomplete="off" placeholder="Buscar títulos..."><button aria-label="Pesquisar" type="submit">⌕</button></form>
  </header>
  <main>
    <section class="hero" id="hero"><div class="hero-copy"><p class="eyebrow">SEU CATÁLOGO, DO SEU JEITO</p><h1>Grandes histórias,<br><em>uma só tela.</em></h1><p class="hero-subtitle">Explore filmes, séries, animes, doramas e canais em um só lugar.</p><div class="hero-actions"><button class="button button-primary" data-category="filme">Explorar filmes</button><button class="button button-ghost" data-category="serie">Ver séries</button></div></div><div class="hero-art" aria-hidden="true"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="hero-grid"></div></div></section>
    <div id="content" aria-live="polite"></div>
  </main>
  <footer><span class="brand small"><span>Site</span>Flix</span><span>Catálogo carregado pela API do projeto</span></footer>
  <script src="/app.js?v=20260918"></script>
</body>
</html>
