<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - Filmes, Séries, Animes e Canais</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #141418;
            --bg-card: #1c1c24;
            --accent-red: #e50914;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 768px) {
            header { flex-direction: row; align-items: center; justify-content: space-between; padding: 18px 48px; }
        }

        .logo-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-icon {
            background: var(--accent-red); color: white; width: 38px; height: 38px;
            border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .logo-text { font-size: 24px; font-weight: 800; color: #fff; }
        .logo-text span { color: var(--accent-red); }

        .nav-tabs-wrapper { padding: 20px 24px 0 24px; }
        @media (min-width: 768px) { .nav-tabs-wrapper { padding: 28px 48px 0 48px; } }

        .nav-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .tab-btn {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            color: var(--text-muted); padding: 10px 20px; border-radius: 30px;
            font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
            display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .tab-btn:hover, .tab-btn.active { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }

        main { flex: 1; padding: 24px; }
        @media (min-width: 768px) { main { padding: 32px 48px; } }

        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 4px; height: 20px; background: var(--accent-red); border-radius: 4px; }

        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }

        .card {
            background: var(--bg-card); border-radius: 14px; overflow: hidden;
            cursor: pointer; border: 1px solid var(--border-color);
            display: flex; flex-direction: column; text-decoration: none; transition: 0.3s;
        }
        .card:hover { transform: translateY(-6px); border-color: rgba(255,255,255,0.3); }

        .card-banner {
            width: 100%; aspect-ratio: 16/9; background: var(--bg-secondary);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: var(--accent-red);
        }

        .card-info { padding: 16px; }
        .card-title { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 6px; }
        .card-desc { font-size: 12px; color: var(--text-muted); }

        footer { border-top: 1px solid var(--border-color); padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" onclick="mudarAba('filmes')">
            <div class="logo-icon"><i class="fa-solid fa-play"></i></div>
            <div class="logo-text">Cine<span>Flix</span></div>
        </div>
    </header>

    <div class="nav-tabs-wrapper">
        <div class="nav-tabs">
            <button class="tab-btn active" id="btn-filmes" onclick="mudarAba('filmes')"><i class="fa-solid fa-film"></i> Catálogo de Filmes</button>
            <button class="tab-btn" id="btn-series" onclick="mudarAba('series')"><i class="fa-solid fa-tv"></i> Catálogo de Séries</button>
            <button class="tab-btn" id="btn-animes" onclick="mudarAba('animes')"><i class="fa-solid fa-dragon"></i> Catálogo de Animes</button>
            <button class="tab-btn" id="btn-canais" onclick="mudarAba('canais')"><i class="fa-solid fa-tower-broadcast"></i> Canais ao Vivo</button>
            <button class="tab-btn" id="btn-eventos" onclick="mudarAba('eventos')"><i class="fa-solid fa-futbol"></i> Eventos Esportivos</button>
        </div>
    </div>

    <main>
        <h2 class="section-title" id="sectionTitle">Acesso Direto aos Catálogos</h2>
        <div class="movies-grid" id="moviesGrid">
            <!-- Os itens serão gerados aqui -->
        </div>
    </main>

    <footer>
        <p>&copy; CineFlix - Todos os direitos reservados.</p>
    </footer>

    <script>
        const conteudos = {
            'filmes': [
                { titulo: "Abrir Lista Completa de Filmes", desc: "Acessar servidor oficial", url: "https://superflixapi.pro/lista?category=filme", icone: "fa-film" },
                { titulo: "Filmes de Ação", desc: "Ver por gênero", url: "https://superflixapi.pro/lista?category=filme&type=generos", icone: "fa-fire" }
            ],
            'series': [
                { titulo: "Abrir Lista Completa de Séries", desc: "Acessar servidor oficial", url: "https://superflixapi.pro/lista?category=serie", icone: "fa-tv" },
                { titulo: "Séries de Drama", desc: "Ver por gênero", url: "https://superflixapi.pro/lista?category=serie&type=generos", icone: "fa-masks-theater" }
            ],
            'animes': [
                { titulo: "Abrir Lista Completa de Animes", desc: "Acessar servidor oficial", url: "https://superflixapi.pro/lista?category=anime", icone: "fa-dragon" },
                { titulo: "Animes Shounen", desc: "Ver por gênero", url: "https://superflixapi.pro/lista?category=anime&type=generos", icone: "fa-bolt" }
            ],
            'canais': [
                { titulo: "Canais ao Vivo (Geral)", desc: "Lista pública de canais", url: "https://superflixapi.pro/lista?category=canais", icone: "fa-tower-broadcast" },
                { titulo: "Guia de Programação (XMLTV)", desc: "Grade de horários", url: "https://superflixapi.pro/lista?category=guia", icone: "fa-calendar-days" }
            ],
            'eventos': [
                { titulo: "Agenda de Eventos Esportivos", desc: "Futebol e Esportes Ao Vivo", url: "https://superflixapi.pro/lista?category=eventos", icone: "fa-futbol" }
            ]
        };

        function mudarAba(cat) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${cat}`).classList.add('active');
            
            const grid = document.getElementById('moviesGrid');
            document.getElementById('sectionTitleinnerText'] = `Acesso Direto - ${cat.toUpperCase()}`;
            grid.innerHTML = '';

            const lista = conteudos[cat] || [];
            lista.forEach(item => {
                const a = document.createElement('a');
                a.className = 'card';
                a.href = item.url;
                a.target = '_blank';
                a.innerHTML = `
                    <div class="card-banner"><i class="fa-solid ${item.icone}"></i></div>
                    <div class="card-info">
                        <div class="card-title">${item.titulo}</div>
                        <div class="card-desc">${item.desc}</div>
                    </div>
                `;
                grid.appendChild(a);
            });
        }

        mudarAba('filmes');
    </script>
</body>
</html>
