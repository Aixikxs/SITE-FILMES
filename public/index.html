<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - Filmes, Séries e Canais</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #141418;
            --bg-card: #1c1c24;
            --accent-red: #e50914;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 768px) {
            header { flex-direction: row; align-items: center; justify-content: space-between; padding: 18px 48px; }
        }

        .logo-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-icon {
            background: var(--accent-red); color: white; width: 38px; height: 38px;
            border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .logo-text { font-size: 24px; font-weight: 800; color: #fff; }
        .logo-text span { color: var(--accent-red); }

        .nav-tabs-wrapper { padding: 20px 24px 0 24px; }
        @media (min-width: 768px) { .nav-tabs-wrapper { padding: 28px 48px 0 48px; } }

        .nav-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .tab-btn {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            color: var(--text-muted); padding: 10px 20px; border-radius: 30px;
            font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
            display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .tab-btn:hover, .tab-btn.active { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }

        main { flex: 1; padding: 24px; }
        @media (min-width: 768px) { main { padding: 32px 48px; } }

        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; width: 4px; height: 20px; background: var(--accent-red); border-radius: 4px; }

        .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }

        .player-card {
            background: var(--bg-card); border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border-color); display: flex; flex-direction: column;
            text-decoration: none; transition: 0.3s;
        }
        .player-card:hover { transform: translateY(-6px); border-color: rgba(229, 9, 20, 0.5); box-shadow: 0 10px 25px rgba(229, 9, 20, 0.2); }

        .card-header-icon {
            background: var(--bg-secondary); padding: 24px; text-align: center;
            font-size: 36px; color: var(--accent-red); border-bottom: 1px solid var(--border-color);
        }

        .card-body { padding: 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .card-title { font-size: 16px; font-weight: 700; color: #fff; }
        .card-desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
        
        .action-badge {
            margin-top: 12px; background: rgba(229, 9, 20, 0.15); color: var(--accent-red);
            font-size: 12px; font-weight: 700; padding: 8px 12px; border-radius: 8px;
            text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        footer { border-top: 1px solid var(--border-color); padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" onclick="mudarSecao('filmes')">
            <div class="logo-icon"><i class="fa-solid fa-play"></i></div>
            <div class="logo-text">Cine<span>Flix</span></div>
        </div>
    </header>

    <div class="nav-tabs-wrapper">
        <div class="nav-tabs">
            <button class="tab-btn active" id="btn-filmes" onclick="mudarSecao('filmes')"><i class="fa-solid fa-film"></i> Filmes</button>
            <button class="tab-btn" id="btn-series" onclick="mudarSecao('series')"><i class="fa-solid fa-tv"></i> Séries & Animes</button>
            <button class="tab-btn" id="btn-canais" onclick="mudarSecao('canais')"><i class="fa-solid fa-tower-broadcast"></i> Canais ao Vivo</button>
            <button class="tab-btn" id="btn-esportes" onclick="mudarSecao('esportes')"><i class="fa-solid fa-futbol"></i> Esportes / Eventos</button>
        </div>
    </div>

    <main>
        <h2 class="section-title" id="sectionTitle">Player Direto de Filmes</h2>
        <div class="content-grid" id="gridContainer"></div>
    </main>

    <footer>
        <p>&copy; CineFlix - Plataforma de Streaming Integrada</p>
    </footer>

    <script>
        const dadosSite = {
            'filmes': [
                { titulo: "Player de Filme em Destaque 1", desc: "Abre diretamente o player oficial de reprodução.", url: "https://superflixapi.pro/filme/tt0068646", icone: "fa-film" },
                { titulo: "Player de Filme em Destaque 2", desc: "Abre o segundo player de transmissão direta.", url: "https://superflixapi.pro/filme/tt0111161", icone: "fa-video" }
            ],
            'series': [
                { titulo: "Player de Série / Episódio", desc: "Abre o player unificado de séries e temporadas.", url: "https://superflixapi.pro/serie/1396/1/1", icone: "fa-tv" }
            ],
            'canais': [
                { titulo: "Canais ao Vivo (Acesso Direto)", desc: "Acessa a interface de transmissão ao vivo.", url: "https://superflixapi.pro/canal/1", icone: "fa-tower-broadcast" }
            ],
            'esportes': [
                { titulo: "Eventos Esportivos", desc: "Acessa a agenda de partidas e eventos ao vivo.", url: "https://superflixapi.pro/lista?category=eventos", icone: "fa-futbol" }
            ]
        };

        function mudarSecao(secao) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${secao}`).classList.add('active');

            const grid = document.getElementById('gridContainer');
            const titulosSecao = {
                'filmes': 'Player Direto de Filmes',
                'series': 'Player Direto de Séries',
                'canais': 'Player de Canais de TV',
                'esportes': 'Transmissões e Esportes'
            };
            
            document.getElementById('sectionTitle').innerText = titulosSecao[secao];
            grid.innerHTML = '';

            const lista = dadosSite[secao] || [];
            lista.forEach(item => {
                const card = document.createElement('a');
                card.className = 'player-card';
                card.href = item.url;
                card.target = '_blank';
                card.innerHTML = `
                    <div class="card-header-icon"><i class="fa-solid ${item.icone}"></i></div>
                    <div class="card-body">
                        <div class="card-title">${item.titulo}</div>
                        <div class="card-desc">${item.desc}</div>
                        <div class="action-badge"><i class="fa-solid fa-play"></i> Assistir Agora</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        mudarSecao('filmes');
    </script>
</body>
</html>
