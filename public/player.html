<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080911"><title>Player — SiteFlix</title><link rel="stylesheet" href="/styles.css"><style>.player-page{min-height:100vh}.player-top{height:74px;display:flex;align-items:center;gap:18px;padding:0 clamp(18px,4vw,56px);border-bottom:1px solid rgba(255,255,255,.08);background:rgba(8,9,17,.88)}.back{color:#fff;text-decoration:none}.player-main{max-width:1100px;margin:auto;padding:28px clamp(18px,4vw,56px)}.video{background:#030305;border:1px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}.video iframe,.video video{width:100%;height:100%;border:0}.msg{color:var(--muted);text-align:center;padding:28px}.player-title{font-size:clamp(18px,3vw,28px);margin:25px 0 8px}.info{color:var(--muted);line-height:1.6;max-width:780px}.controls,.episodes{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.player-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.controls select,.episodes button{background:var(--surface-2);color:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}.episodes button.active{background:var(--accent);border-color:var(--accent)}</style></head><body class="player-page"><header class="player-top"><a class="back" href="/">← Voltar</a><a class="brand" href="/" aria-label="SiteFlix início"><span>Site</span>Flix</a><span id="title" class="player-title" style="margin:0;font-size:16px">Player</span></header><main class="player-main"><div id="video" class="video"><div class="msg">Carregando player...</div></div><div class="player-actions"><button id="fullscreen" class="button button-primary" type="button">Tela cheia</button><a class="button button-ghost" href="/">Voltar ao catálogo</a></div><h1 id="infoTitle" class="player-title">Carregando...</h1><p id="info" class="info"></p><div id="controls" class="controls"></div><div id="episodes" class="episodes"></div></main><script>
const API="/api",p=new URLSearchParams(location.search),type=(p.get("type")||"filme").toLowerCase(),id=p.get("id")||"",$=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function playback(d){return d?.stream_url||d?.m3u8_url||d?.hls_url||d?.m3u8||d?.play_url||d?.player_url||d?.embed_url||d?.iframe_url||d?.url||""}function render(url){if(!url){$("#video").innerHTML='<div class="msg">O player não foi disponibilizado pela API para este conteúdo.</div>';return}if(!/^https?:\/\//i.test(url)){ $("#video").innerHTML='<div class="msg">Endereço de reprodução inválido.</div>';return}const frame=document.createElement("iframe");frame.src=url;frame.allow="autoplay *; encrypted-media *; picture-in-picture *; fullscreen *";frame.allowFullscreen=true;$("#video").replaceChildren(frame)}
function episodes(d){const list=Array.isArray(d?.episodes)?d.episodes:[];if(!list.length)return;const c=$("#episodes");list.forEach((x,i)=>{const b=document.createElement("button");b.textContent=x.title||x.name||`Episódio ${i+1}`;b.onclick=()=>render(playback(x));c.append(b)})}$("#fullscreen").onclick=()=>document.querySelector("#video iframe, #video video")?.requestFullscreen?.();
(async()=>{if(!id){$("#video").innerHTML='<div class="msg">Conteúdo não informado.</div>';return}try{const r=await fetch(`${API}/meta?type=${encodeURIComponent(type)}&id=${encodeURIComponent(id)}`,{headers:{Accept:"application/json"}});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json(),title=d.title||d.name||"Conteúdo";$("#title").textContent=title;$("#infoTitle").textContent=title;$("#info").textContent=d.overview||d.synopsis||d.description||"";render(playback(d));episodes(d)}catch(e){$("#video").innerHTML='<div class="msg"><strong>Conteúdo temporariamente indisponível</strong><br><small>Tente novamente em instantes.</small></div>';console.error("[v0] Falha no player",e)}})();
</script></body></html>
