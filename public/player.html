<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player - SiteFlix</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui,sans-serif}.top{height:58px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #202638;background:#0b0f18}.back{color:#fff;text-decoration:none;margin-right:18px}.title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wrap{max-width:1200px;margin:auto;padding:16px}.video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.video iframe,.video video{width:100%;height:100%;border:0}.msg{padding:30px;text-align:center;color:#aab3c5}.controls,.episodes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.controls select,.episodes button{background:#171d2b;color:#fff;border:1px solid #30394e;border-radius:8px;padding:9px 12px}.episodes button.active{background:#7c5cff}.info{color:#aab3c5;margin-top:14px}</style></head><body><header class="top"><a class="back" href="/">← Voltar</a><span class="title" id="title">Player</span></header><main class="wrap"><div id="video" class="video"><div class="msg">Carregando player...</div></div><div id="controls" class="controls"></div><div id="episodes" class="episodes"></div><div id="info" class="info"></div></main><script>
const API="/api",p=new URLSearchParams(location.search),type=(p.get("type")||"filme").toLowerCase(),id=p.get("id")||"",src=p.get("src")||"";let season=Math.max(1,Number(p.get("season")||1)),episode=Math.max(1,Number(p.get("episode")||1));const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function isStream(u){return/\.(m3u8|mpd)(\?|#|$)/i.test(u)||/^(blob:|data:)/i.test(u)}
function render(u){if(!u){$("#video").innerHTML='<div class="msg">Player não informado.</div>';return}if(isStream(u)){const v=document.createElement("video");v.src=u;v.controls=true;v.autoplay=true;v.playsInline=true;v.setAttribute("webkit-playsinline","");$("#video").innerHTML="";$("#video").append(v);v.play().catch(()=>{});return}$("#video").innerHTML='<iframe src="'+esc(u)+'" allow="autoplay *; encrypted-media *; picture-in-picture *; fullscreen *; clipboard-write *; accelerometer *; gyroscope *; web-share *" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>'}
function play(){if(!id){$("#video").innerHTML='<div class="msg">Conteúdo não informado.</div>';return}const u=src||(type==="filme"?API+"/filme/"+encodeURIComponent(id):type==="serie"||type==="anime"||type==="dorama"?API+"/serie/"+encodeURIComponent(id)+"/"+season+"/"+episode:"");render(u);$("#info").textContent=type==="filme"?"Filme":type==="canal"?"Canal ao vivo":"Temporada "+season+" • Episódio "+episode}
async function channel(){try{const r=await fetch(API+"/lista?category=canais&format=json",{cache:"no-store"}),d=await r.json(),a=Array.isArray(d)?d:(d?.items||d?.results||d?.data||[]),x=a.find(v=>[v?.id,v?.tmdb_id,v?.slug,v?.uid,v?.name,v?.title,v?.channel_name].some(z=>String(z??"")===String(id)));const u=src||x?.stream_url||x?.m3u8_url||x?.hls_url||x?.m3u8||x?.play_url||x?.player_url||x?.embed_url||x?.iframe_url||"";$("#title").textContent=x?.name||x?.title||x?.channel_name||"Canal";$("#info").textContent="Canal ao vivo";render(u);if(!u)$("#video").innerHTML='<div class="msg">Este canal não forneceu um endereço de reprodução.</div>'}catch(e){console.error(e);$("#video").innerHTML='<div class="msg">Não foi possível carregar o canal.</div>'}}
function controls(){const c=$("#controls");c.innerHTML="";if(type==="filme"||type==="canal")return;const s=document.createElement("select");for(let i=1;i<=30;i++){const o=document.createElement("option");o.value=i;o.textContent="Temporada "+i;o.selected=i===season;s.append(o)}s.onchange=()=>{season=+s.value;episode=1;episodes();play()};c.append(s)}
function episodes(){const b=$("#episodes");b.innerHTML="";if(type==="filme"||type==="canal")return;for(let i=1;i<=24;i++){const x=document.createElement("button");x.textContent="Episódio "+i;x.className=i===episode?"active":"";x.onclick=()=>{episode=i;episodes();play()};b.append(x)}}
(async()=>{if(type==="canal")await channel();else{try{const d=await fetch(API+"/meta?type="+encodeURIComponent(type)+"&id="+encodeURIComponent(id)).then(r=>r.json());$("#title").textContent=d.title||"Player"}catch{}controls();episodes();play()}})();
</script></body></html>
