<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player - SiteFlix</title><style>body{margin:0;background:#05070c;color:#fff;font-family:system-ui,sans-serif}.top{height:58px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #202638;background:#0b0f18}.back{color:#fff;text-decoration:none;margin-right:18px}.title{font-weight:700}.wrap{max-width:1200px;margin:auto;padding:16px}.video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.video iframe{width:100%;height:100%;border:0}.msg{padding:30px;text-align:center;color:#aab3c5}.episodes{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.episodes button{background:#171d2b;color:#fff;border:1px solid #30394e;border-radius:8px;padding:9px 12px}.episodes button.active{background:#7c5cff}.info{color:#aab3c5;margin-top:14px}</style></head><body><header class="top"><a class="back" href="/">← Voltar</a><span class="title" id="title">Player</span></header><main class="wrap"><div id="video" class="video"><div class="msg">Carregando player...</div></div><div id="episodes" class="episodes"></div><div id="info" class="info"></div></main><script>
const API="https://superflixapi.monster";const p=new URLSearchParams(location.search);const type=p.get("type")||"filme";const id=p.get("id");let season=Number(p.get("season")||1);let episode=Number(p.get("episode")||1);
const $=s=>document.querySelector(s);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function play(){if(!id){$("#video").innerHTML='<div class="msg">Conteúdo não informado.</div>';return}let url;if(type==="filme")url=API+"/filme/"+encodeURIComponent(id);else if(type==="serie"||type==="anime"||type==="dorama")url=API+"/serie/"+encodeURIComponent(id)+"/"+season+"/"+episode;else return loadChannel();$("#video").innerHTML='<iframe src="'+url+'" allow="autoplay *; encrypted-media *; picture-in-picture *; fullscreen *; clipboard-write *; accelerometer *; gyroscope *; web-share *" allowfullscreen></iframe>'}
async function loadChannel(){try{const r=await fetch(API+"/lista?category=canais&format=json");const a=await r.json();const items=Array.isArray(a)?a:(a.items||a.results||[]);const x=items.find(v=>String(v.id??v.tmdb_id??v.slug??v.name??"")===String(id)||String(v.slug??"")===String(id)||String(v.name??"")===String(id));const url=x?.play_url||x?.player_url||x?.embed_url||x?.page_url;if(url)$("#video").innerHTML='<iframe src="'+url+'" allow="autoplay *; encrypted-media *; picture-in-picture *; fullscreen *; web-share *" allowfullscreen></iframe>';else $("#video").innerHTML='<div class="msg">Player do canal não foi retornado pela API.</div>';$("#title").textContent=x?.name||x?.title||"Canal"}catch(e){$("#video").innerHTML='<div class="msg">Não foi possível carregar o canal.</div>'}}
function episodes(){if(type==="filme"||type==="canal")return;const box=$("#episodes");for(let e=1;e<=24;e++){const b=document.createElement("button");b.textContent="Episódio "+e;if(e===episode)b.className="active";b.onclick=()=>{episode=e;episodes();play()};box.append(b)}}
$("#info").textContent=type==="filme"?"Filme":type==="canal"?"Canal ao vivo":("Temporada "+season+" • Episódio "+episode);episodes();play();
</script></body></html>
